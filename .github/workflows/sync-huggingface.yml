name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face (Hair & Beauty Space)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Saadat555:$HF_TOKEN@huggingface.co/spaces/Saadat555/maison-saadat-hair-beauty main

      - name: Push to Hugging Face (Virtual Try-On Space)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Saadat555:$HF_TOKEN@huggingface.co/spaces/Saadat555/maison-saadat-virtual-tryon main
